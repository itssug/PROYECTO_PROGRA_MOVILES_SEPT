# pubspec.yaml — Agrega estas dependencias al pubspec.yaml existente del proyecto
#
# En tu pubspec.yaml existente, dentro de "dependencies:", agrega:

# dependencies:
#   flutter:
#     sdk: flutter
#   http: ^1.2.0          # Para llamadas HTTP a la API Django
#   fl_chart: ^0.68.0     # Para gráficos de barras y pastel
#   intl: ^0.19.0         # Para formato de fechas

# Luego ejecuta en terminal:
#   flutter pub get

name: frontend
description: App móvil diabetes tipo II - Universidad Franz Tamayo
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  fl_chart: ^0.68.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true